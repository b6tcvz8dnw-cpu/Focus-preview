name: Generate dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Run tests and production build
        run: |
          npm test
          npm run build
      - name: Publish lockfile on a separate review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/dependency-lockfile
          git add package-lock.json
          git diff --cached --quiet && {
            echo "No lockfile changes to publish."
            exit 0
          }
          git commit -m "build: add verified npm lockfile"
          git push origin chore/dependency-lockfile
