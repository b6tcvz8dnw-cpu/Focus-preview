name: FOCUS quality checks

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        run: npm install --no-audit --no-fund
      - name: Run integrity tests
        run: npm test
      - name: Build production PWA
        run: npm run build

      - name: Upload production build for review
        uses: actions/upload-artifact@v4
        with:
          name: focus-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
